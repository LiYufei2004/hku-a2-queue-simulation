<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <!-- Schematic redrawn for the passenger advisor. Coordinates share the backend
       layout (model-core.js `paths`, 1536x1024) so queue overlays line up.
       Simplified and not to scale; our own drawing, no third-party artwork. -->
  <defs>
    <linearGradient id="floorA" x1="0" x2="1"><stop offset="0" stop-color="#dcebfb"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="floorB" x1="1" x2="0"><stop offset="0" stop-color="#d8f3ea"/><stop offset="1" stop-color="#eefaf5"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c6475"/></marker>
  </defs>
  <rect width="1536" height="1024" fill="#f7fafc"/>

  <!-- Walkable floor -->
  <path d="M20 22H410V70H585V285H600V180H780V75H790V188H1516V287H830V465L880 515V605H800V710H705V605H625V710H515V605H455V515L500 465V145H20Z" fill="url(#floorA)"/>
  <path d="M790 188H1516V287H830V465L880 515V605H800V710H705V605H700V180H790Z" fill="url(#floorB)"/>
  <rect x="600" y="180" width="105" height="430" fill="#f0f6fb"/>

  <!-- Walls -->
  <g fill="none" stroke="#7d8b99" stroke-width="12" stroke-linejoin="round" stroke-linecap="square">
    <path d="M20 20H410V70H585V285"/>
    <path d="M20 145H500V465L455 515V605H515V710"/>
    <path d="M625 615V710"/>
    <path d="M780 75V188H1516"/>
    <path d="M830 465L880 515V605H800V710"/>
    <path d="M705 615V710"/>
  </g>
  <g fill="none" stroke="#7d8b99" stroke-width="10" stroke-dasharray="26 14">
    <path d="M830 465V287H1516"/>
  </g>
  <text x="1000" y="312" font-size="17" fill="#6a7b88" text-anchor="middle">Glass partition</text>

  <!-- Lifts -->
  <g stroke="#58697a" stroke-width="3">
    <rect x="535" y="618" width="80" height="80" rx="4" fill="#e3e8ee"/>
    <rect x="715" y="618" width="80" height="80" rx="4" fill="#e3e8ee"/>
  </g>
  <g fill="#3f5162"><path d="M575 636l-12 18h24z"/><path d="M575 680l-12-18h24z"/><path d="M755 636l-12 18h24z"/><path d="M755 680l-12-18h24z"/></g>
  <g font-weight="700" text-anchor="middle">
    <rect x="455" y="726" width="200" height="40" rx="8" fill="#095ccc"/><text x="555" y="753" font-size="21" fill="#fff">Left · Direct lifts</text>
    <rect x="665" y="726" width="210" height="40" rx="8" fill="#007d89"/><text x="770" y="753" font-size="21" fill="#fff">Right · Lifts via A1</text>
  </g>

  <!-- Entrances -->
  <g font-weight="700">
    <rect x="30" y="162" width="150" height="36" rx="8" fill="#095ccc"/><text x="105" y="187" font-size="20" fill="#fff" text-anchor="middle">Side A · West</text>
    <rect x="1310" y="200" width="190" height="36" rx="8" fill="#007d89"/><text x="1405" y="225" font-size="20" fill="#fff" text-anchor="middle">Side B · East</text>
  </g>
  <g fill="#4c6475" font-size="17">
    <path d="M60 122H8" stroke="#4c6475" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="70" y="128">to University Street · Library · Kadoorie</text>
    <path d="M1460 345H1528" stroke="#4c6475" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1450" y="351" text-anchor="end">to Chow Yei Ching Building · Centennial Campus</text>
  </g>

  <!-- Location inset (simplified campus strip, west to east) -->
  <g transform="translate(830 12)">
    <rect width="690" height="160" rx="12" fill="#ffffff" stroke="#c9d7e2" stroke-width="2"/>
    <text x="16" y="26" font-size="16" font-weight="700" fill="#173a51">Where is this? (simplified, not to scale)</text>
    <g font-size="13" fill="#173a51" text-anchor="middle">
      <rect x="16" y="40" width="88" height="38" rx="4" fill="#e9eef3" stroke="#a9b8c4"/><text x="60" y="64">Library</text>
      <rect x="112" y="40" width="88" height="38" rx="4" fill="#e9eef3" stroke="#a9b8c4"/><text x="156" y="57">Kadoorie</text><text x="156" y="72">Bio. Sciences</text>
      <rect x="296" y="40" width="112" height="38" rx="4" fill="#f6e1d3" stroke="#d6a585"/><text x="352" y="57">Haking Wong /</text><text x="352" y="72">Composite</text>
      <rect x="452" y="40" width="98" height="38" rx="4" fill="#f6e1d3" stroke="#d6a585"/><text x="501" y="57">Chow Yei</text><text x="501" y="72">Ching</text>
      <rect x="566" y="40" width="108" height="38" rx="4" fill="#e1ecf5" stroke="#9ab4c9"/><text x="620" y="57">Jockey Club</text><text x="620" y="72">Tower</text>
    </g>
    <path d="M16 92H674" stroke="#095ccc" stroke-width="5"/>
    <text x="226" y="88" font-size="12" fill="#095ccc" text-anchor="middle" font-weight="700">University Street</text>
    <path d="M196 92H96" stroke="#095ccc" stroke-width="0"/>
    <!-- A2 lifts marker between Haking Wong and Chow Yei Ching -->
    <circle cx="430" cy="92" r="10" fill="#e5484d" stroke="#fff" stroke-width="3"/>
    <text x="430" y="114" font-size="13" font-weight="700" fill="#e5484d" text-anchor="middle">A2 lifts (you are here)</text>
    <text x="300" y="112" font-size="12" fill="#095ccc" text-anchor="middle">← Side A</text>
    <text x="560" y="112" font-size="12" fill="#007d89" text-anchor="middle">Side B →</text>
    <path d="M16 146Q340 120 674 150" fill="none" stroke="#b9c3cc" stroke-width="12"/>
    <text x="120" y="142" font-size="12" fill="#5d6d79">Pok Fu Lam Road</text>
    <circle cx="430" cy="133" r="7" fill="#c8102e"/><text x="444" y="138" font-size="12" fill="#c8102e" font-weight="700">MTR Exit A (A1 level)</text>
  </g>

  <!-- Lift route legend -->
  <g transform="translate(22 812)">
    <rect width="1492" height="180" rx="12" fill="#ffffff" stroke="#c9d7e2" stroke-width="2"/>
    <line x1="746" y1="20" x2="746" y2="160" stroke="#c9d7e2" stroke-width="2" stroke-dasharray="8 8"/>
    <rect x="28" y="30" width="200" height="38" rx="8" fill="#095ccc"/><text x="128" y="56" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Left · Direct</text>
    <text x="28" y="100" font-size="17" fill="#173a51">University Street level</text>
    <path d="M250 120H560" stroke="#095ccc" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="580" y="126" font-size="18" font-weight="700" fill="#173a51">MTR concourse</text>
    <text x="28" y="150" font-size="15" fill="#536e7e">Fast trip (~40 s round trip). Usually the longer queue.</text>
    <rect x="776" y="30" width="230" height="38" rx="8" fill="#007d89"/><text x="891" y="56" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Right · Via A1</text>
    <text x="776" y="100" font-size="17" fill="#173a51">University Street level</text>
    <path d="M990 120H1090" stroke="#007d89" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="1098" y="100" width="150" height="40" rx="8" fill="#cbd5dd"/><text x="1173" y="126" font-size="16" font-weight="700" fill="#173a51" text-anchor="middle">A1 · Pok Fu Lam</text>
    <path d="M1256 120H1320" stroke="#007d89" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="1330" y="126" font-size="18" font-weight="700" fill="#173a51">MTR concourse</text>
    <text x="776" y="160" font-size="15" fill="#536e7e">Stops at A1 first (~200 s round trip). Often a shorter queue.</text>
  </g>
</svg>
